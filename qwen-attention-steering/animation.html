 return [1-cWeight,cWeight]
}
function render(){let idx=Math.min(6,Math.floor(ms/DURATION)),u=clamp((ms-idx*DURATION)/DURATION);g.clearRect(0,0,W,H);base();scenes[idx](u);let attentionWeights=idx===5?matchReadout(u):null;if(idx!==chapter){chapter=idx;document.getElementById('chapter').textContent=String(idx+1).padStart(2,'0')+' / 07';document.getElementById('title').textContent=chapters[idx][0];document.getElementById('caption').textContent=chapters[idx][1];[].forEach.call(document.querySelectorAll('#chapters button'),(b,j)=>b.classList.toggle('active',j===idx))}document.getElementById('seek').value=Math.floor(ms);document.getElementById('time').textContent='00:'+String(Math.floor(ms/1000)).padStart(2,'0')+' / 00:42';document.getElementById('previous').disabled=idx===0;document.getElementById('next').disabled=idx===6;window.DemoState={chapter:idx,phase:u,playing,attentionSelectedMask:[1,0,1,1],attentionWeights}}
function setPlay(v){playing=v;document.getElementById('play').textContent=v?'Ⅱ 暂停':'▶ 播放';document.getElementById('play').setAttribute('aria-label',v?'暂停动画':'播放动画');last=0}
function seek(value){ms=clamp(Number(value),0,TOTAL-1);render()}
document.getElementById('play').addEventListener('click',()=>setPlay(!playing));
document.getElementById('previous').addEventListener('click',()=>{setPlay(false);seek((Math.max(0,Math.floor(ms/DURATION)-1))*DURATION+300)});
document.getElementById('next').addEventListener('click',()=>{setPlay(false);seek((Math.min(6,Math.floor(ms/DURATION)+1))*DURATION+300)});
document.getElementById('seek').addEventListener('input',e=>{setPlay(false);seek(e.target.value)});
chapters.forEach((item,i)=>{let b=document.createElement('button');b.type='button';b.innerHTML=String(i+1)+' <span>'+item[0]+'</span>';b.setAttribute('aria-label','跳到第 '+(i+1)+' 幕：'+item[0]);b.addEventListener('click',()=>{setPlay(false);seek(i*DURATION+300)});document.getElementById('chapters').appendChild(b)});
function tick(now){if(playing){if(last){ms+=Math.min(now-last,70);if(ms>=TOTAL)ms=0}last=now}render();requestAnimationFrame(tick)}
window.DemoControls={seekToChapter:(i,phase=.5)=>{setPlay(false);seek(clamp(i,0,6)*DURATION+clamp(phase)*DURATION)},play:()=>setPlay(true),pause:()=>setPlay(false)};
const dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;g.scale(dpr,dpr);setPlay(playing);render();requestAnimationFrame(tick);
})();
</script>
